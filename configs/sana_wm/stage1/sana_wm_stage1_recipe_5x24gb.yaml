# SANA-WM stage-1 recipe for 5x24GB. Measured peak: 22.4 GB/rank, 10s/step.
#
# Same objective, data path and optimizer as the 8x80GB baseline. Two changes carry
# almost all of the memory saving, and the first is counter-intuitive:
#
#   cp_size: 1        Context parallel is OFF. The fused GDN context-parallel Triton
#                     kernels allocate ~5 GB/rank of scratch OUTSIDE PyTorch's
#                     allocator, and `triton_block_fusion: true` is mandatory whenever
#                     CP is on (BidirectionalGDNTriton raises NotImplementedError
#                     without it), so CP's cost cannot be separated from CP. Turning it
#                     off costs throughput at equal sequence length but is the single
#                     largest saving. FSDP2 still shards the model across all ranks.
#
#   latent_frames     Only matters once CP is off. Under CP each rank held 1/N of the
#                     sequence, so cutting frames 64% saved 1.0 GB; without CP each rank
#                     holds all of it and the same cut saves 4.4 GB.
#
# Measured on A100-80GB, per-process resident memory (nvidia-smi --query-compute-apps),
# 4 ranks unless noted:
#     CP=4, 25 frames  32.8 GB   10 s/step
#     CP=4,  9 frames  31.8 GB
#     CP=1, 25 frames  27.9 GB   19 s/step
#     CP=1,  9 frames  23.5 GB    7 s/step
#     CP=1, 13 frames  22.4 GB   10 s/step   (5 ranks)
#     CP=1,  9 frames  21.3 GB    7 s/step   (5 ranks)  <- most margin
#
# If a card gives you less than ~22 GB usable, drop latent_frames to 9.
#
# Horizon caveat: 13 latent frames is ~6s of video at 16 fps, while a WBench
# navigation case runs ~16s. This trains shorter-horizon camera control than the model
# is evaluated on. Raise latent_frames if you have memory to spare.
#
# Launch:
#   torchrun --nproc_per_node=5 train_video_scripts/train_sana_wm_stage1.py \
#     --config_path configs/sana_wm/stage1/sana_wm_stage1_recipe_5x24gb.yaml
#
# Agents: copy this file and edit the data section, as with the baseline recipe.
# SANA-WM stage-1 baseline recipe (node 0).
#
# Identical objective, optimizer and CP2/FSDP2 settings to the released bidirectional
# stage-1 recipe; only the data configuration is meant to change. Every node trains
# from the released base checkpoint, so checkpoints are never chained and only the
# newest is retained.
#
# This is the file agents copy and modify: add shards under data.data_dir, adjust
# caption_proportion / data_repeat / external_data_filter, and set train.max_steps to
# match how much data was added.
#
# Training writes a merged, inference-loadable checkpoint at
#   <work_dir>/checkpoints/epoch_<E>_step_<S>.pth
# alongside the sharded FSDP state, which the kernel discards after evaluation.
task: ti2v
data:
  hf_dataset_repo: null
  data_dir:
    sekai_game: data/sekai_game_train_961frames_16fps_ovl640
  external_caption_suffixes: [_LongSceneStaticCaption-Qwen3-VL-30B-A3B-Instruct]
  caption_proportion:
    sekai_game:
      _LongSceneStaticCaption-Qwen3-VL-30B-A3B-Instruct: 100
  data_repeat:
    sekai_game: 16
  external_data_filter:
    sekai_game:
      _vmafmotion: {min: 0.5, max: 50}
      _unimatch: {min: 3.0, max: 80}
      _dover: {min: 0.25, max: 1.0}
      _vlm_entity_filter: {min: 0, max: 10}
      _vlm_quality_filter: {min: 0.5, max: 1.5}
  type: SanaWMZipLatentDataset
  image_size: 720
  aspect_ratio_type: ASPECT_RATIO_VIDEO_720_MS_DIV32
  transform: default_train_video
  load_text_feat: false
  load_vae_feat: true
  vae_cache_dir: data/vae_cache/LTX2VAE_diffusers_704x1280/sekai_game_train_961frames_16fps_ovl640
  num_frames: 961
  latent_frames: 13
  sort_dataset: false
  shuffle_dataset: true
  shuffle_mode: item
  return_raymap: false
  use_plucker: false
  vae_ratio: [8, 32]
  cam_sample_strategy: last
  use_relative_pose: false
  normalize_poses: false
  return_delta_actions: false
  return_chunk_plucker: true
model:
  model: SanaMSVideoCamCtrl_1600M_P1_D20
  image_size: 720
  mixed_precision: bf16
  fp32_attention: true
  load_from: hf://Efficient-Large-Model/SANA-WM_bidirectional/dit/sana_wm_1600m_720p.safetensors
  aspect_ratio_type: ASPECT_RATIO_VIDEO_720_MS_DIV32
  multi_scale: true
  camctrl_type: BidirectionalGDNUCPESinglePathLiteLABothTriton
  attn_type: BidirectionalGDNTriton
  softmax_every_n: 4
  linear_head_dim: 112
  conv_kernel_size: 4
  k_conv_only: true
  ffn_type: GLUMBConvTemp
  t_kernel_size: 3
  mlp_acts: [silu, silu, null]
  mlp_ratio: 3.0
  use_pe: true
  pos_embed_type: wan_rope
  qk_norm: true
  cross_norm: true
  cross_attn_type: flash
  class_dropout_prob: 0.1
  chunk_split_strategy: first_chunk_plus_one
  cam_attn_compress: 1
  init_cam_from_base: true
  use_delta_actions: false
  use_delta_pose_additive: false
  use_chunk_plucker_post_attn: true
  chunk_plucker_channels: 48
  chunk_plucker_post_attn_blocks: 20
  use_autograd_kernel: true
vae:
  vae_type: LTX2VAE_diffusers
  vae_pretrained: Efficient-Large-Model/SANA-WM_bidirectional
  weight_dtype: bfloat16
  vae_latent_dim: 128
  vae_downsample_rate: 32
  vae_stride: [8, 32, 32]
  if_cache: false
  use_framewise_encoding: true
  use_framewise_decoding: true
  tile_sample_stride_num_frames: 64
  tile_sample_min_num_frames: 96
text_encoder:
  text_encoder_name: gemma-2-2b-it
  caption_channels: 2304
  y_norm: true
  y_norm_scale_factor: 0.01
  model_max_length: 300
  chi_prompt:
    - 'Given a user prompt, generate an "Enhanced prompt" that provides detailed visual descriptions suitable for image generation. Evaluate the level of detail in the user prompt:'
    - '- If the prompt is simple, focus on adding specifics about colors, shapes, sizes, textures, and spatial relationships to create vivid and concrete scenes.'
    - '- If the prompt is already detailed, refine and enhance the existing details slightly without overcomplicating.'
    - 'Here are examples of how to transform or refine prompts:'
    - '- User Prompt: A cat sleeping -> Enhanced: A small, fluffy white cat curled up in a round shape, sleeping peacefully on a warm sunny windowsill, surrounded by pots of blooming red flowers.'
    - '- User Prompt: A busy city street -> Enhanced: A bustling city street scene at dusk, featuring glowing street lamps, a diverse crowd of people in colorful clothing, and a double-decker bus passing by towering glass skyscrapers.'
    - 'Please generate only the enhanced description for the prompt below and avoid including any additional commentary or evaluations:'
    - 'User Prompt: '
scheduler:
  train_sampling_steps: 1000
  predict_flow_v: true
  noise_schedule: linear_flow
  pred_sigma: false
  learn_sigma: true
  flow_shift: 9.95
  inference_flow_shift: 9.8
  weighting_scheme: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  vis_sampler: flow_dpm-solver
train:
  use_fsdp: true
  fsdp_version: 2
  cp_size: 1                 # context parallel OFF; see the header
  num_workers: 4
  seed: 3407
  train_batch_size: 1
  train_batch_size_image: 1
  num_epochs: 500
  early_stop_hours: 8
  max_steps: 400          # agents choose this from how much data they added
  gradient_accumulation_steps: 8   # recovers effective batch at batch_size 1
  grad_checkpointing: true
  gradient_clip: 0.5
  optimizer:
    type: AdamW
    lr: 1.0e-5
    betas: [0.9, 0.999]
    eps: 1.0e-10
    weight_decay: 0.0
  auto_lr: null
  lr_schedule: constant
  lr_schedule_args:
    num_warmup_steps: 0
  log_interval: 10
  save_model_steps: 200
  save_model_epochs: 5
  checkpoint_total_limit: 1
  visualize: false
  deterministic_validation: true
  online_metric: false
  work_dir: output/sana_wm_sana_wm_stage1_recipe_5x24gb
  ema_update: false
  timestep_weight: false
  noise_multiplier: 0.0
  ltx_image_condition_prob: 0.9
  extra:
    cp:
      scan_backend: torch
      triton_block_fusion: false
      fsdp2:
        reshard_after_forward: true
        limit_all_gathers: false
        backward_prefetch: backward_pre
work_dir: output/sana_wm_sana_wm_stage1_recipe_5x24gb
resume_from: null
load_from: null
caching: false
report_to: none
tracker_project_name: sana-wm-recipe
name: sana_wm_stage1_recipe_5x24gb
loss_report_name: loss
